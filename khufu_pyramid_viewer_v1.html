
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Khufu Pyramid | Evidence Model v1</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101316;color:#e9e6dc;font:14px/1.5 system-ui,-apple-system,sans-serif}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
header{padding:12px 14px;border-bottom:1px solid #343a3e;background:#171c20}
h1{font-size:16px;margin:0 0 3px}
header p{margin:0;color:#aeb8ba;font-size:12px}
#stage{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#panel{position:absolute;left:10px;top:10px;width:min(290px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:#151b20eF;border:1px solid #3a444a;border-radius:10px;padding:10px}
#panel h2{font-size:13px;margin:0 0 8px}
.group{border-top:1px solid #394147;padding:8px 0}
.group:first-of-type{border-top:0}
label{display:flex;gap:7px;align-items:center;margin:6px 0;color:#d4d9d7;font-size:12px}
button{background:#27343b;color:#f3f1e9;border:1px solid #52616a;border-radius:7px;padding:7px 9px;margin:2px;font-size:12px}
#info{padding:10px 13px;background:#171c20;border-top:1px solid #343a3e;max-height:26vh;overflow:auto;font-size:12px;color:#cbd2d0}
#info strong{color:#fff}
a{color:#a8d4e6}
.tag{display:inline-block;padding:2px 6px;border:1px solid #53616a;border-radius:20px;margin:2px;font-size:10px;color:#d9e0dc}
.small{font-size:11px;color:#aab5b5}
.warning{color:#f2c98d}
</style>
</head>
<body>
<div id="app">
<header>
<h1>クフ王の大ピラミッド｜研究統合モデル v1</h1>
<p>根拠のある測量値を優先。未確定領域を確定した部屋として描かない。</p>
</header>

<div id="stage">
<div id="panel">
<h2>表示レイヤー</h2>
<div class="group">
<label><input type="checkbox" id="shell" checked> 外形（Petrie測量基準）</label>
<label><input type="checkbox" id="rooms" checked> 既知の内部構造（位置概略）</label>
<label><input type="checkbox" id="north" checked> 北面回廊（研究値・不確実性あり）</label>
<label><input type="checkbox" id="void" checked> Big Void（検出範囲の概念表示）</label>
</div>
<div class="group">
<button data-view="all">全体</button>
<button data-view="north">北面</button>
<button data-view="section">断面</button>
<button id="rotate">自動回転：ON</button>
</div>
<div class="group small">
ドラッグ：回転 ／ ピンチ・ホイール：拡大縮小 ／ 2本指ドラッグ：移動
</div>
</div>
</div>

<div id="info">
<strong>モデルの読み方</strong><br>
オブジェクトをタップすると根拠を表示。外形寸法はPetrie（1883）の化粧石底辺平均9,068.8 in＝約230.35m、頂点高5,776 in＝約146.71mを採用。これは現存する外装の実測ではなく、原形復元に関する歴史的測量値。<br>
<span class="warning">注意：</span>
内部構造は位置・形状の確度を分けた研究表示。Big Voidは長さ最低30mという検出情報であり、正確な輪郭を意味しない。
</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const stage=document.querySelector('#stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101316);

const camera=new THREE.PerspectiveCamera(45,1,.1,3000);
camera.position.set(310,210,330);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,65,0);

scene.add(new THREE.HemisphereLight(0xdde8ef,0x5b4c3c,2));

const sun=new THREE.DirectionalLight(0xffe3b5,2.2);
sun.position.set(-180,260,120);
scene.add(sun);

const grid=new THREE.GridHelper(320,16,0x53616a,0x293238);
grid.position.y=-.2;
scene.add(grid);

const root=new THREE.Group();
scene.add(root);
const items=[];

function mat(color,opacity=1,wire=false){
return new THREE.MeshStandardMaterial({
color,
transparent:opacity<1,
opacity,
wireframe:wire,
side:THREE.DoubleSide,
roughness:.9
});
}

function addMesh(geo,material,name,detail){
const m=new THREE.Mesh(geo,material);
m.name=name;
m.userData.detail=detail;
root.add(m);
items.push(m);
return m;
}

const B=230.35,H=146.71,half=B/2;

const pyramidGeo=new THREE.BufferGeometry();
const verts=[
-half,0,-half,
half,0,-half,
half,0,half,
-half,0,half,
0,H,0
];
const idx=[
0,2,1,0,3,2,
0,1,4,
1,2,4,
2,3,4,
3,0,4
];

pyramidGeo.setAttribute(
'position',
new THREE.Float32BufferAttribute(verts,3)
);
pyramidGeo.setIndex(idx);
pyramidGeo.computeVertexNormals();

const shell=addMesh(
pyramidGeo,
mat(0xd9c7a0,.22),
'外形（原形復元）',
'Petrie 1883：化粧石底辺平均 9,068.8 in = 230.35m。頂点高 5,776 in = 146.71m。底辺は四辺の測量値の平均。外装石の現存状態を再現したものではなく、原形の基準面。'
);

const edges=new THREE.LineSegments(
new THREE.EdgesGeometry(pyramidGeo),
new THREE.LineBasicMaterial({
color:0xd9c7a0,
transparent:true,
opacity:.65
})
);
root.add(edges);

function box(name,pos,size,color,detail,opacity=.65){
const m=addMesh(
new THREE.BoxGeometry(...size),
mat(color,opacity),
'',
detail
);
m.name=name;
m.position.set(...pos);
return m;
}

// 既知内部構造：現段階では測量座標による確定配置ではなく概略図示
const roomsGroup=new THREE.Group();
root.add(roomsGroup);

function room(name,pos,size,color,detail){
const m=new THREE.Mesh(
new THREE.BoxGeometry(...size),
mat(color,.72)
);
m.position.set(...pos);
m.name=name;
m.userData.detail=detail;
roomsGroup.add(m);
items.push(m);
return m;
}

room(
'地下の岩窟（概略）',
[0,-4,0],
[8,3,7],
0x9a9a9a,
'Petrieは地下室と通路が岩盤を粗く掘った未完成空間であると記録。形状は不整形で、ここでは寸法・輪郭を確定できないため、正確な立体形状として描いていない。'
);

room(
'女王の間（位置概略）',
[0,21.2,0],
[5.25,5.0,5.8],
0x6ba6b7,
'Petrie測量：室内幅 約205.85 in（5.23m）、床長 約227.50 in（5.78m）。高さは床面定義に注意が必要。モデル位置・高さは概略表示で、測量図面に基づく最終配置前。'
);

room(
'王の間（位置概略）',
[0,43.0,0],
[10.5,5.9,5.2],
0xc28b62,
'Petrie測量記録から王の間の平面寸法・床レベルを参照。図示位置は高さ約1,691 in（42.96m）を基準とした概略配置。実際の壁の不整・石材目地・変形は未反映。'
);

const corridor=room(
'北面回廊 SP-NFC（概念位置）',
[0,2,half-5],
[2.02,2.18,9.06],
0x70c7df,
'2025年の高感度ミューオン測定値として幅2.02±0.06m、高さ2.18±0.17m、長さ9.06±0.07mが報告。ERT研究は約2.5m×2.5m規模を示す。座標系の変換・原点整合が完了していないため、ここでは外形に対する正確な位置を主張しない概念表示。'
);
corridor.visible=false;

const voidMark=box(
'Big Void（検出情報）',
[0,83,0],
[5,3,30],
0xd4a6dc,
'ScanPyramids 2017：大回廊の上方に、断面が大回廊に類似し、最低長さ30mの大きな空隙を検出。正確な幅・高さ・輪郭・端点は確定していない。薄い線状表示は検出位置の概念表現であり、確定形状ではない。',
.2
);
voidMark.material.wireframe=true;

const faceLine=new THREE.Line(
new THREE.BufferGeometry().setFromPoints([
new THREE.Vector3(-half,0,half),
new THREE.Vector3(0,H,0),
new THREE.Vector3(half,0,half)
]),
new THREE.LineBasicMaterial({color:0x8aa7b5})
);
root.add(faceLine);

const ray=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let down=false;
let auto=true;

renderer.domElement.addEventListener('pointerdown',()=>{
down=true;
});

renderer.domElement.addEventListener('pointerup',e=>{
if(!down)return;
down=false;

pointer.x=e.clientX/innerWidth*2-1;
pointer.y=-(e.clientY-stage.getBoundingClientRect().top)/stage.clientHeight*2+1;

ray.setFromCamera(pointer,camera);
const hit=ray.intersectObjects(items,false)[0];

if(hit){
document.querySelector('#info').innerHTML=
'<strong>'+hit.object.name+'</strong><br>'+
hit.object.userData.detail;
}
});

document.querySelectorAll('input[type=checkbox]').forEach(el=>{
el.addEventListener('change',()=>{
const id=el.id;
if(id==='shell'){
shell.visible=el.checked;
edges.visible=el.checked;
}
if(id==='rooms')roomsGroup.visible=el.checked;
if(id==='north')corridor.visible=el.checked;
if(id==='void')voidMark.visible=el.checked;
});
});

document.querySelector('#rotate').onclick=()=>{
auto=!auto;
document.querySelector('#rotate').textContent=
'自動回転：'+(auto?'ON':'OFF');
};

document.querySelectorAll('[data-view]').forEach(b=>{
b.onclick=()=>{
const v=b.dataset.view;

if(v==='north'){
camera.position.set(0,90,370);
controls.target.set(0,50,0);
}else if(v==='section'){
camera.position.set(330,100,0);
controls.target.set(0,65,0);
}else{
camera.position.set(310,210,330);
controls.target.set(0,65,0);
}
controls.update();
};
});

function resize(){
const w=stage.clientWidth;
const h=stage.clientHeight;
camera.aspect=w/h;
camera.updateProjectionMatrix();
renderer.setSize(w,h);
}
addEventListener('resize',resize);
resize();

function animate(){
requestAnimationFrame(animate);
if(auto&&!controls.state)root.rotation.y+=.0015;
controls.update();
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
