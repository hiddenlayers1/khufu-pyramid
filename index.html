
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KHUFU PYRAMID | Research Model v2</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101316;color:#eee;
 font-family:system-ui,-apple-system,sans-serif
}
header{
 padding:14px;background:#171c20;
 border-bottom:1px solid #394147
}
h1{font-size:17px;margin:0 0 4px}
header p{font-size:11px;color:#aeb8bc;margin:0}
#stage{
 height:58vh;min-height:340px;
 position:relative;background:#101316
}
#view{width:100%;height:100%;display:block;touch-action:none}
#status{
 position:absolute;bottom:9px;left:10px;
 padding:7px 10px;border-radius:7px;
 background:#172128dd;color:#b9d7df;
 font-size:11px
}
#panel{padding:13px;background:#171c20}
h2{font-size:14px;margin:0 0 10px}
.section{padding:10px 0;border-top:1px solid #394147}
label{
 display:inline-flex;align-items:center;
 gap:6px;margin:5px 10px 5px 0;font-size:12px
}
button{
 background:#293840;color:white;
 border:1px solid #64747d;border-radius:7px;
 padding:9px 11px;margin:3px;font-size:12px
}
button:active{background:#46606b}
input[type=range]{width:100%}
#info{
 padding:14px;background:#20272c;
 border-top:1px solid #394147;
 font-size:12px;line-height:1.7;
 min-height:100px
}
.note{color:#f0c68b}
.small{font-size:11px;color:#aab5b8}
</style>
</head>

<body>

<header>
<h1>KHUFU PYRAMID / RESEARCH MODEL v2.0</h1>
<p>HALF CUTAWAY · EXTERIOR & INTERIOR STRUCTURE</p>
</header>

<div id="stage">
<canvas id="view"></canvas>
<div id="status">3Dモデルを準備しています...</div>
</div>

<div id="panel">

<h2>表示モード</h2>
<div class="section">
<button id="half">ハーフカット</button>
<button id="outside">外装</button>
<button id="skeleton">スケルトン</button>
<button id="section">断面</button>
</div>

<div class="section">
<h2>構造レイヤー</h2>
<label><input type="checkbox" id="shellToggle" checked> 外装側</label>
<label><input type="checkbox" id="frameToggle" checked> 骨格側</label>
<label><input type="checkbox" id="roomsToggle" checked> 部屋・通路</label>
<label><input type="checkbox" id="voidToggle" checked> 検出空間</label>
</div>

<div class="section">
<h2>外装の透過率</h2>
<div class="small">不透明 ← → 透明</div>
<input type="range" id="opacity" min="0" max="100" value="100">
</div>

<div class="section">
<h2>視点操作</h2>
<button id="reset">全体表示</button>
<button id="north">北面</button>
<button id="rotate">自動回転 ON</button>
<p class="small">
ドラッグ：回転<br>
ピンチ：拡大縮小<br>
2本指ドラッグ：移動
</p>
</div>

</div>

<div id="info">
<strong>研究モデル v2.0</strong><br>
オブジェクトをタップすると説明が表示されます。
</div>

<script type="module">

import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas=document.getElementById('view');
const status=document.getElementById('status');
const info=document.getElementById('info');

try{

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101316);

const camera=new THREE.PerspectiveCamera(42,1,0.1,2000);
camera.position.set(270,190,310);

const renderer=new THREE.WebGLRenderer({
 canvas,
 antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.target.set(0,65,0);
controls.minDistance=100;
controls.maxDistance=650;

scene.add(new THREE.HemisphereLight(0xffffff,0x65513b,2));

const sun=new THREE.DirectionalLight(0xffe5bd,2.5);
sun.position.set(-150,250,180);
scene.add(sun);

const grid=new THREE.GridHelper(300,20,0x52616a,0x293238);
grid.position.y=-.5;
scene.add(grid);

const root=new THREE.Group();
scene.add(root);

const shellGroup=new THREE.Group();
const frameGroup=new THREE.Group();
const roomsGroup=new THREE.Group();
const voidGroup=new THREE.Group();

root.add(shellGroup,frameGroup,roomsGroup,voidGroup);

const selectable=[];

const B=230.35;
const H=146.71;
const s=B/2;

// Materials
const stoneMaterial=new THREE.MeshStandardMaterial({
 color:0xcbb28a,
 roughness:.9,
 transparent:true,
 opacity:1,
 side:THREE.DoubleSide
});

const frameMaterial=new THREE.LineBasicMaterial({
 color:0xd6c49e,
 transparent:true,
 opacity:.85
});

const passageMaterial=new THREE.MeshStandardMaterial({
 color:0x66b7d0,
 roughness:.8
});

const chamberMaterial=new THREE.MeshStandardMaterial({
 color:0xc38d60,
 roughness:.85
});

const detectedMaterial=new THREE.MeshBasicMaterial({
 color:0xc58bd9,
 wireframe:true
});

// Geometry helper
function triangle(a,b,c){
 const geo=new THREE.BufferGeometry();
 geo.setAttribute(
  'position',
  new THREE.Float32BufferAttribute([
   ...a,...b,...c
  ],3)
 );
 geo.computeVertexNormals();
 return geo;
}

function addTriangle(group,a,b,c){
 const mesh=new THREE.Mesh(
  triangle(a,b,c),
  stoneMaterial
 );
 group.add(mesh);
 return mesh;
}

// Pyramid vertices
const A=[-s,0,-s];
const B1=[0,0,-s];
const C=[0,H,0];
const D=[-s,0,s];
const E=[0,0,s];

const F=[s,0,-s];
const G=[s,0,s];
const P=[0,H,0];

// LEFT HALF: exterior shell
addTriangle(shellGroup,A,D,C);
addTriangle(shellGroup,A,B1,C);
addTriangle(shellGroup,D,C,E);

// Base of exterior half
addTriangle(shellGroup,A,D,E);
addTriangle(shellGroup,A,E,B1);

// RIGHT HALF: exposed skeleton
const framePoints=[
 [B1,F],
 [F,G],
 [G,E],
 [E,B1],
 [B1,P],
 [F,P],
 [G,P],
 [E,P]
];

function lineBetween(group,a,b,color=0xd6c49e){
 const geo=new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(...a),
  new THREE.Vector3(...b)
 ]);
 const line=new THREE.Line(
  geo,
  new THREE.LineBasicMaterial({color})
 );
 group.add(line);
 return line;
}

framePoints.forEach(pair=>{
 lineBetween(frameGroup,pair[0],pair[1]);
});

// Horizontal reference levels on skeleton side
for(let y=15;y<140;y+=15){
 const z=s*(1-y/H);
 const x=s*(1-y/H);

 lineBetween(
  frameGroup,
  [0,y,-z],
  [x,y,0],
  0x667a82
 );
}

// Central cut surface boundary
lineBetween(frameGroup,B1,C,0xf0d6a8);
lineBetween(frameGroup,E,C,0xf0d6a8);
lineBetween(frameGroup,B1,E,0xf0d6a8);

// Structure helper
function addBox(group,name,pos,size,material,description){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(...size),
  material
 );
 mesh.position.set(...pos);
 mesh.name=name;
 mesh.userData.description=description;
 group.add(mesh);
 selectable.push(mesh);
 return mesh;
}

// Known chambers: diagrammatic placement only
addBox(
 roomsGroup,
 '地下の岩窟',
 [0,-3,0],
 [9,3,8],
 new THREE.MeshStandardMaterial({color:0x969696}),
 '地下の岩窟。Petrieの記録では岩盤を掘削した未完成の空間。ここでは不整形な実測輪郭を再現していません。'
);

addBox(
 roomsGroup,
 '女王の間',
 [0,21,0],
 [5.23,5,5.78],
 chamberMaterial,
 '女王の間。Petrieの測量記録を参考にした平面寸法の概略表示。幅約5.23m、長さ約5.78m。配置座標は最終測量座標への整合前です。'
);

addBox(
 roomsGroup,
 '王の間',
 [0,43,0],
 [10.5,5.9,5.2],
 chamberMaterial,
 '王の間。Petrieの測量記録を参照した概略表示。位置・壁形状の厳密な座標復元は未完了です。'
);

// Schematic passage paths
function addPassage(name,points,description){
 const curve=new THREE.CatmullRomCurve3(
  points.map(p=>new THREE.Vector3(...p))
 );
 const geometry=new THREE.TubeGeometry(curve,48,.8,8,false);
 const mesh=new THREE.Mesh(geometry,passageMaterial);
 mesh.name=name;
 mesh.userData.description=description;
 roomsGroup.add(mesh);
 selectable.push(mesh);
 return mesh;
}

addPassage(
 '下降通路（概略）',
 [
  [0,0,110],
  [0,-5,85],
  [0,-12,50],
  [0,-25,12]
 ],
 '下降通路。Petrieの測量図を基礎に今後座標を確定する対象。現在は経路の概念表示であり、正確な勾配・長さ・位置の再現ではありません。'
);

addPassage(
 '上昇通路（概略）',
 [
  [0,4,50],
  [0,12,30],
  [0,20,12],
  [0,27,0]
 ],
 '上昇通路。Petrieの測量図に基づく復元対象。現在は概略経路です。'
);

addPassage(
 '大回廊（概略）',
 [
  [0,27,0],
  [0,34,0],
  [0,48,0],
  [0,57,0]
 ],
 '大回廊。実際の床・側壁・持ち送り天井の形状は、測量断面図と照合して次段階で復元します。'
);

// North Face Corridor: not yet placed at survey coordinates
addBox(
 voidGroup,
 '北面回廊 SP-NFC（概念表示）',
 [0,3,105],
 [2.02,2.18,9.06],
 detectedMaterial,
 '北面回廊。公表されたミューオン測定寸法の概念表示。幅2.02±0.06m、高さ2.18±0.17m、長さ9.06±0.07m。ピラミッド全体の座標系への正確な変換は未完了です。'
);

// Big Void marker: not a confirmed room shape
addBox(
 voidGroup,
 'Big Void（検出情報）',
 [0,83,0],
 [5,3,30],
 detectedMaterial,
 'ScanPyramids 2017。大回廊上方に最低長さ30mの空隙を検出。正確な幅・高さ・輪郭は未確定です。この箱は検出情報の概念記号であり、確定した部屋の形状ではありません。'
);

// Display controls
const shellToggle=document.getElementById('shellToggle');
const frameToggle=document.getElementById('frameToggle');
const roomsToggle=document.getElementById('roomsToggle');
const voidToggle=document.getElementById('voidToggle');

shellToggle.onchange=e=>{
 shellGroup.visible=e.target.checked;
};

frameToggle.onchange=e=>{
 frameGroup.visible=e.target.checked;
};

roomsToggle.onchange=e=>{
 roomsGroup.visible=e.target.checked;
};

voidToggle.onchange=e=>{
 voidGroup.visible=e.target.checked;
};

// Modes
function setMode(mode){

 shellGroup.visible=mode!=='skeleton';
 frameGroup.visible=mode!=='outside';
 roomsGroup.visible=mode!=='outside';
 voidGroup.visible=mode==='half'||mode==='skeleton';

 shellToggle.checked=shellGroup.visible;
 frameToggle.checked=frameGroup.visible;
 roomsToggle.checked=roomsGroup.visible;
 voidToggle.checked=voidGroup.visible;

}

document.getElementById('half').onclick=()=>{
 setMode('half');
};

document.getElementById('outside').onclick=()=>{
 setMode('outside');
};

document.getElementById('skeleton').onclick=()=>{
 setMode('skeleton');
};

document.getElementById('section').onclick=()=>{
 setMode('skeleton');
 camera.position.set(330,90,0);
 controls.target.set(0,55,0);
 controls.update();
};

// Opacity
document.getElementById('opacity').oninput=e=>{
 stoneMaterial.opacity=Number(e.target.value)/100;
};

// Camera
function view(position,target){
 camera.position.set(...position);
 controls.target.set(...target);
 controls.update();
}

document.getElementById('reset').onclick=()=>{
 view([270,190,310],[0,65,0]);
};

document.getElementById('north').onclick=()=>{
 view([0,100,370],[0,55,0]);
};

// Rotation
let rotating=true;

document.getElementById('rotate').onclick=()=>{
 rotating=!rotating;
 document.getElementById('rotate').textContent=
 '自動回転 '+(rotating?'ON':'OFF');
};

// Tap selection
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

let startX=0;
let startY=0;

canvas.addEventListener('pointerdown',e=>{
 startX=e.clientX;
 startY=e.clientY;
});

canvas.addEventListener('pointerup',e=>{
 const moved=Math.hypot(
  e.clientX-startX,
  e.clientY-startY
 );

 if(moved>8)return;

 const rect=canvas.getBoundingClientRect();

 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(pointer,camera);

 const hits=raycaster.intersectObjects(selectable,false);

 if(hits.length){
  const obj=hits[0].object;
  info.innerHTML=
   '<strong>'+obj.name+'</strong><br>'+
   obj.userData.description;
 }
});

// Resize
function resize(){
 const w=canvas.clientWidth;
 const h=canvas.clientHeight;

 if(!w||!h)return;

 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h,false);
}

window.addEventListener('resize',resize);
resize();

// Animation
function animate(){
 requestAnimationFrame(animate);

 if(rotating){
  root.rotation.y+=.0012;
 }

 controls.update();
 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

status.textContent='3D表示中｜ハーフカットモデル v2.0';

}catch(error){

 console.error(error);

 status.textContent='3Dエラー：'+error.message;

 info.innerHTML=
 '<strong>読み込みエラー</strong><br>'+error.message;

}

</script>
</body>
</html>
