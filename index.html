<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Khufu Research Model v10.0</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1217;color:#edf2f5;font:14px/1.5 system-ui}header{padding:14px 16px;background:#111820;border-bottom:1px solid #33414d}h1{font-size:18px;margin:0}header p,.muted,small{color:#aab7c2;font-size:11px;margin:3px 0}main{display:grid;grid-template-columns:minmax(0,1fr) 310px}#view{height:calc(100vh - 68px);min-height:480px;touch-action:none}aside{background:#171f27;border-left:1px solid #33414d;padding:14px;overflow:auto;max-height:calc(100vh - 68px)}h2{font-size:13px;margin:14px 0 8px}button{background:#263746;border:1px solid #4b6070;color:white;border-radius:7px;padding:8px;margin:3px}button.active{background:#41617a}label{display:flex;gap:8px;align-items:center;margin:9px 0;font-size:12px}.sw{width:12px;height:12px;border-radius:3px;flex:none}.card{border:1px solid #33414d;border-radius:9px;padding:10px;margin:8px 0;background:#121920}#info{font-size:12px;min-height:50px}input[type=range]{width:100%}#status{color:#f0c779;font-size:11px}@media(max-width:760px){main{display:flex;flex-direction:column}#view{height:56vh;min-height:370px}aside{max-height:none;border:0;border-top:1px solid #33414d}}
</style></head><body><header><h1>クフ王の大ピラミッド｜研究統合モデル v10.0</h1><p>既知構造・検出空間・未調査領域を分離｜底辺 約230.3m／当初高さ 約146.6m｜北：+Y</p></header>
<main><div id="view"></div><aside>
<div class="card"><b>探索モード</b><br><button data-view="all" class="active">全体</button><button data-view="north">北面</button><button data-view="inside">内部</button><button data-view="section">断面</button><br><label>回転速度</label><input id="speed" type="range" min="0" max="1.5" step=".05" value=".25"><button id="rotate">⟳ 回転 ON</button><button id="reset">視点リセット</button></div>
<h2>表示レイヤー</h2>
<label><input type="checkbox" data-layer="outer" checked><i class="sw" style="background:#cdb996"></i>外形（半透明）</label>
<label><input type="checkbox" data-layer="known" checked><i class="sw" style="background:#f2be46"></i>既知の部屋・通路</label>
<label><input type="checkbox" data-layer="detected" checked><i class="sw" style="background:#eb7d41"></i>検出された空間</label>
<label><input type="checkbox" data-layer="survey" checked><i class="sw" style="background:#469be1"></i>北面調査領域</label>
<label><input type="checkbox" data-layer="unknown" checked><i class="sw" style="background:#858c96"></i>未調査領域の目印</label>
<label><input type="checkbox" data-layer="ground" checked><i class="sw" style="background:#6e8269"></i>基準面（地表）</label>
<h2>選択オブジェクト</h2><div class="card" id="info">3Dオブジェクトをタップ／クリックすると詳細が表示されます。</div>
<h2>精度・注意事項</h2><p class="muted">公開研究を参考にした模式モデルで、実測スキャンではありません。通路・部屋は簡略化。検出空間は説明用の仮形状で、確定形状ではありません。グレーは未調査領域の位置目印で、空洞の存在を意味しません。</p><p class="muted">ドラッグ：回転／ホイール・ピンチ：拡大縮小／2本指：平行移動。単位：m。</p><div id="status">モデル読み込み中…</div></aside></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const host=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0d1217);
const camera=new THREE.PerspectiveCamera(42,1,.1,2000);camera.up.set(0,0,1);camera.position.set(280,-330,220);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x60616a,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(180,-220,260);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,55);controls.enableDamping=true;
let model,auto=true,speed=.25;const info=document.querySelector('#info'),status=document.querySelector('#status');
const layer=n=>n.includes('Outer shell')?'outer':n.includes('Ground')?'ground':n.includes('Big Void')||n.includes('North face corridor')?'detected':n.includes('North chevron')?'survey':n.includes('Unsurveyed')?'unknown':'known';
const desc={
'Outer shell | translucent envelope':'外形：底辺約230.3m、当初高さ約146.6m。半透明の概念形状。',
'Ground reference plane':'地表の基準面。',
'Ascending passage | known schematic':'上昇通路。勾配約26.5°を参考にした模式表現。実寸より太く表示。',
'Grand Gallery | known schematic':'大回廊。既知構造の模式表現。断面・東西方向のずれは簡略化。',
'Descending passage | known schematic':'下降通路。地下方向への既知通路を模式的に表現。',
'King chamber | known':'王の間。既知の部屋。形状は概略。',
'Queen chamber | known':'女王の間。既知の部屋。形状は概略。',
'Subterranean chamber | known schematic':'地下室。地表下約30mを目安に置いた模式形状。',
'Big Void | detected region, approximate':'Big Void。ミューオン調査で検出された空間領域。箱形状は説明用の仮置きで、確定形状ではない。',
'North face corridor | detected location marker':'北面回廊状空間の検出位置を示す目印。形状・寸法の再現ではない。',
'North chevron | survey area marker':'北面シェブロン周辺の調査領域。',
'Unsurveyed region | marker only, not a void':'未調査領域の目印。空洞や部屋の存在を意味しない。'};
new GLTFLoader().load('./khufu_research_model_v10.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.material.side=THREE.DoubleSide;o.userData.layer=layer(o.name)}});status.textContent='読み込み完了：オブジェクトをタップして詳細を表示';apply();},e=>status.textContent='GLB読み込みに失敗。HTMLとGLBを同じフォルダに置いてください。');
function resize(){let w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(host);resize();
function apply(){if(!model)return;let state={};document.querySelectorAll('[data-layer]').forEach(x=>state[x.dataset.layer]=x.checked);model.traverse(o=>{if(o.isMesh)o.visible=state[o.userData.layer]!==false})}
document.querySelectorAll('[data-layer]').forEach(x=>x.onchange=apply);
function preset(v){auto=false;document.querySelector('#rotate').textContent='⟳ 回転 OFF';document.querySelector('[data-layer="outer"]').checked=v!=='section';apply();if(v==='north'){camera.position.set(0,340,110);controls.target.set(0,0,55)}else if(v==='inside'){camera.position.set(100,-100,85);controls.target.set(0,0,45)}else if(v==='section'){camera.position.set(240,-270,120);controls.target.set(0,0,40)}else{camera.position.set(280,-330,220);controls.target.set(0,0,55)}controls.update()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');preset(b.dataset.view)});
document.querySelector('#speed').oninput=e=>speed=+e.target.value;document.querySelector('#rotate').onclick=()=>{auto=!auto;document.querySelector('#rotate').textContent=auto?'⟳ 回転 ON':'⟳ 回転 OFF'};document.querySelector('#reset').onclick=()=>preset('all');
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',()=>{auto=false;document.querySelector('#rotate').textContent='⟳ 回転 OFF'});
renderer.domElement.addEventListener('click',e=>{let r=renderer.domElement.getBoundingClientRect();ptr.x=(e.clientX-r.left)/r.width*2-1;ptr.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(ptr,camera);if(!model)return;let hit=ray.intersectObject(model,true)[0];if(hit){let o=hit.object;info.innerHTML='<b>'+o.name.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</b><br>'+(desc[o.name]||'研究モデル内の構造要素')}})
let last=0;function loop(t){requestAnimationFrame(loop);if(auto&&model){let dt=Math.min((t-last)/1000,.05);model.rotation.z+=dt*speed*.12}last=t;controls.update();renderer.render(scene,camera)}loop(0);
</script></body></html>
